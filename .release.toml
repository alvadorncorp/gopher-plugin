# Release configuration for the Gopher plugin.
#
# The release engine updates only top-level manifest version fields. Keep
# README, marketplace metadata, fixtures, and release validation notes aligned
# before publishing when those files mention the version explicitly.

[groups.default]
tag = "v{version}"
notes_paths = [
  "plugins/gopher",
  ".agents/plugins/marketplace.json",
  ".claude-plugin/marketplace.json",
  ".grok-plugin/marketplace.json",
  "README.md",
  "tests",
]
[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.claude-plugin/plugin.json"

[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.codex-plugin/plugin.json"

[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.grok-plugin/plugin.json"
