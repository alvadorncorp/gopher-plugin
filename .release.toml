# Release configuration for the Gopher plugin.
#
# The release engine updates top-level manifest version fields and the
# plugins[0].version of every marketplace catalog listed as a target. Keep
# README, fixtures, and release validation notes aligned before publishing
# when those files mention the version explicitly.

[groups.default]
tag = "v{version}"
notes_paths = [
  "plugins/gopher",
  ".agents/plugins/marketplace.json",
  ".claude-plugin/marketplace.json",
  ".grok-plugin/marketplace.json",
  ".kimi-plugin/marketplace.json",
  ".omp-plugin/marketplace.json",
  "package.json",
  "README.md",
  "tests",
]
[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.claude-plugin/plugin.json"

[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.codex-plugin/plugin.json"

[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.grok-plugin/plugin.json"

[[groups.default.targets]]
type = "plugin"
path = "plugins/gopher/.kimi-plugin/plugin.json"

[[groups.default.targets]]
type = "plugin"
path = ".kimi-plugin/plugin.json"
# The codex (.agents) and omp catalogs declare no plugin version: they inherit
# it at install time, so they are not bump targets.

[[groups.default.targets]]
type = "marketplace"
path = ".claude-plugin/marketplace.json"

[[groups.default.targets]]
type = "marketplace"
path = ".grok-plugin/marketplace.json"

[[groups.default.targets]]
type = "marketplace"
path = ".kimi-plugin/marketplace.json"

[[groups.default.targets]]
type = "node"
path = "package.json"

[groups.current]
source = "tag"
tag = "v{version}"
notes_paths = [
  "plugins/gopher",
  ".agents/plugins/marketplace.json",
  ".claude-plugin/marketplace.json",
  ".grok-plugin/marketplace.json",
  "package.json",
  ".omp-plugin/marketplace.json",
  "README.md",
  "tests",
]
[[groups.current.targets]]
type = "go"
path = "."
